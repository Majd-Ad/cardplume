    <path d="M13 23.1C17.3 18 22.1 11.5 27 5.7" stroke="#17221d" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <circle cx="12.7" cy="23.2" r="1.9" fill="#ff7947" stroke="#17221d" stroke-width="1.2"/>
  </g>
