  <style>
    /* ---------------------------------------------------------------------------
       Intro: a blank card, and the plume signs the brand onto it.

       Written inline, in CSS only, on purpose. It has to paint before the JS bundle
       lands — that is the whole job of a preloader — and the site's CSP allows inline
       styles but not inline scripts, so nothing here may depend on JS. The one piece
       of script involved is the dismissal in src/main.jsx, which fades .cp-loader out
       once React has mounted; if that never happens, cp-failsafe clears the screen on
       its own after 12s rather than leaving a visitor staring at a card forever.

       The ink is one continuous stroke drawn with stroke-dashoffset, and the quill is
       carried along the same line by cp-pen — 110 points sampled off that exact path,
       so the nib sits on the tip of the ink rather than near it. Both run linear for
       the same 2s, which is what keeps them together. If the wordmark path is ever
       redrawn, the cp-pen keyframes have to be re-sampled from it.
       --------------------------------------------------------------------------- */
    .cp-loader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:#17221d;animation:cp-failsafe .6s linear 12s both}
    .cp-loader:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,rgba(217,251,143,.15),transparent 58%)}
    /* The exit is an animation rather than a transition so that it replaces cp-failsafe on
       this element: the failsafe already owns opacity here, and a property under an
       animation's control ignores transitions. */
    .cp-loader.is-out{pointer-events:none;animation:cp-out .5s ease both}
    @keyframes cp-failsafe{to{opacity:0;visibility:hidden}}
    @keyframes cp-out{to{opacity:0;transform:scale(1.04)}}
    body:has(.cp-loader){overflow:hidden}
    .cp-stage{display:grid;position:relative;justify-items:center;gap:27px;width:min(78vw,430px)}
    .cp-card{display:grid;position:relative;place-items:center;width:100%;aspect-ratio:1.7;border-radius:12px;background:#f6f3ec;box-shadow:0 30px 60px rgba(0,0,0,.45);animation:cp-card-in .8s cubic-bezier(.22,1,.36,1) both}
    /* the hairline a printer would call the safe area — it makes the blank card read as stock */
    .cp-card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(23,34,29,.09);border-radius:7px}
    @keyframes cp-card-in{from{opacity:0;transform:translateY(30px) rotate(-3.5deg) scale(.92)}to{opacity:1;transform:none}}
    /* overflow stays visible so the plume can rise off the top edge of the card */
    .cp-write{width:84%;overflow:visible}
    .cp-ink{fill:none;stroke:#17221d;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:cp-draw 2s linear .55s both}
    .cp-swash{fill:none;stroke:#d9fb8f;stroke-width:27;stroke-linecap:round;opacity:.62;stroke-dasharray:1;stroke-dashoffset:1;animation:cp-draw .55s cubic-bezier(.4,0,.2,1) 2.45s both}
    @keyframes cp-draw{to{stroke-dashoffset:0}}
    /* transform-box/origin pinned so the pen turns around its own nib: the CSS default for
       SVG elements is the middle of the view box, which would swing the quill across the card */
    .cp-quill,.cp-quill-lift{transform-box:view-box;transform-origin:0 0}
    .cp-quill{animation:cp-pen 2s linear .55s both}
    /* one animation, not two: fade-in and lift-off both touch transform, and a second
       animation with fill:both would backwards-fill over the first one from t=0 */
    .cp-quill-lift{animation:cp-quill-life 3.15s ease both}
    @keyframes cp-quill-life{0%{opacity:0;transform:translate(52px,-62px)}17%{opacity:1;transform:none}81%{opacity:1;transform:none}100%{opacity:0;transform:translate(78px,-124px) rotate(12deg)}}
    .cp-plume{fill:#d9fb8f;stroke:#17221d;stroke-width:6;stroke-linejoin:round}
    .cp-spine{fill:none;stroke:#17221d;stroke-width:5;stroke-linecap:round}
    .cp-nib{fill:#ff7947;stroke:#17221d;stroke-width:4}
    .cp-tag{margin:0;color:rgba(246,243,236,.6);font:11px/1 'DM Mono',ui-monospace,monospace;letter-spacing:2.6px;animation:cp-fade-up .6s ease 2.65s both}
    @keyframes cp-fade-up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    .cp-bar{width:132px;height:2px;overflow:hidden;border-radius:2px;background:rgba(246,243,236,.14)}
    .cp-bar i{display:block;width:0;height:100%;background:#d9fb8f;animation:cp-bar 3.1s cubic-bezier(.45,0,.15,1) .2s both}

    /* Reduced motion: same card, same signature, nothing moves — the loader is simply
       the finished frame, and main.jsx clears it as soon as React is up. */
    @media (prefers-reduced-motion:reduce){
      .cp-card,.cp-ink,.cp-swash,.cp-tag,.cp-bar i,.cp-quill,.cp-quill-lift{animation:none}
      .cp-ink,.cp-swash{stroke-dashoffset:0}
      .cp-bar i{width:100%}
      .cp-quill-lift{opacity:0}
    }
