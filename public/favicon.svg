<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Browser-tab mark. Drawn tight to the edges with rounded corners of its own, because a
       tab renders it at 16px where any padding would shrink the artwork to a smudge. The
       app-icon files in this folder use a looser crop instead, since iOS and Android apply
       their own rounding and masking on top. -->
